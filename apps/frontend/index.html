<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA: This links to the icon shown on the browser tab -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />

    <!-- PWA: Viewport meta is essential for mobile display -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA: iOS-specific meta tags for home screen installation -->
    <!-- Apple doesn't fully honor the web manifest, so these are required for iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trainer" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA: Theme color for Android Chrome's address bar -->
    <meta name="theme-color" content="#1a1a2e" />

    <meta name="description" content="Just Train — a private training record. Log the work, keep going, nothing else. For athletes and the coaches who guide them." />

    <title>Just Train</title>

    <!-- Theme: stamp an explicit light/dark choice before first paint (no flash).
         'system' or unset leaves the attribute off, so the CSS prefers-color-scheme
         media query follows the OS. Kept in sync by src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) { /* storage blocked — fall back to system */ }
    </script>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>

    <!-- Vite injects the compiled React bundle here -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
